<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" color="#e6ede8" viewBox="0 0 760 330" role="img" aria-label="Spec sections feed three hashes: the three non-functional sections and imports feed a hash that triggers a full re-render, each functional unit feeds its own text hash that re-renders from that unit, and required modules' public interface feeds a hash that also triggers a full re-render.">
<style>
  :root { --bg:#101613; --fg:#e6ede8; --muted:#9bab9f; --accent:#4fd39b; --accent-soft:#163626; --warn:#f0a265; --warn-soft:#3a2415; --kept:#3b4a42; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--fg); }
  text.m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
  text.t { font-weight: 700; font-size: 13px; }
  text.s { font-size: 11px; fill: var(--muted); }
  text.acc { fill: var(--accent); font-weight: 600; }
  text.warn { fill: var(--warn); font-weight: 600; }
  .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.2; }
  .box.acc { fill: var(--accent-soft); stroke: var(--accent); }
  .box.kept { fill: var(--kept); stroke: var(--kept); }
  .box.warn { fill: var(--warn-soft); stroke: var(--warn); }
  .ln { stroke: var(--fg); stroke-width: 1.2; fill: none; }
  .ln.acc { stroke: var(--accent); stroke-width: 1.6; }
  .ln.dash { stroke-dasharray: 4 3; }
  .ln.warn { stroke: var(--warn); }
</style>
<rect width="100%" height="100%" fill="#182119" rx="8"/>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6ede8"/></marker>
          <marker id="ahacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd39b"/></marker>
        </defs>
        <!-- spec document -->
        <rect x="20" y="20" width="230" height="290" rx="6" class="box"/>
        <text x="32" y="42" class="t">tasklist.mint.md</text>
        <rect x="32" y="54" width="206" height="26" rx="3" class="box"/>
        <text x="40" y="71" class="m">frontmatter &#183; imports, stack</text>
        <rect x="32" y="86" width="206" height="22" rx="3" class="box"/>
        <text x="40" y="101" class="m">## definitions</text>
        <rect x="32" y="112" width="206" height="22" rx="3" class="box"/>
        <text x="40" y="127" class="m">## implementation</text>
        <rect x="32" y="138" width="206" height="22" rx="3" class="box"/>
        <text x="40" y="153" class="m">## test</text>
        <text x="32" y="184" class="m">## functional</text>
        <rect x="32" y="192" width="206" height="22" rx="3" class="box acc"/>
        <text x="40" y="207" class="m">FR1 &#183; title, spec, acceptance</text>
        <rect x="32" y="220" width="206" height="22" rx="3" class="box acc"/>
        <text x="40" y="235" class="m">FR2 &#183; &#8230;</text>
        <rect x="32" y="248" width="206" height="22" rx="3" class="box acc"/>
        <text x="40" y="263" class="m">FR3 &#183; &#8230; + resources</text>
        <text x="32" y="296" class="s">resources: embedded verbatim, hashed</text>

        <!-- required module -->
        <rect x="300" y="250" width="150" height="56" rx="6" class="box"/>
        <text x="312" y="270" class="t">taskstore</text>
        <text x="312" y="288" class="s">required module,</text>
        <text x="312" y="301" class="s">public interface only</text>

        <!-- hashes -->
        <rect x="490" y="70" width="190" height="44" rx="6" class="box"/>
        <text x="500" y="88" class="m">nonFunctionalSpecHash</text>
        <text x="500" y="104" class="s">any change &#8594; full re-render</text>

        <rect x="490" y="180" width="190" height="44" rx="6" class="box acc"/>
        <text x="500" y="198" class="m">textHash per unit</text>
        <text x="500" y="214" class="s">change &#8594; re-render from that unit</text>

        <rect x="490" y="256" width="190" height="44" rx="6" class="box"/>
        <text x="500" y="274" class="m">requiredModuleCodeHash</text>
        <text x="500" y="290" class="s">interface change &#8594; full re-render</text>

        <!-- arrows -->
        <path d="M238 67 C 330 67, 380 92, 488 92" class="ln" marker-end="url(#ah)"/>
        <path d="M238 97 C 330 97, 380 92, 488 92" class="ln"/>
        <path d="M238 123 C 330 123, 380 92, 488 92" class="ln"/>
        <path d="M238 149 C 330 149, 380 92, 488 92" class="ln"/>
        <path d="M238 203 L 488 203" class="ln acc" marker-end="url(#ahacc)"/>
        <path d="M238 231 C 330 231, 380 203, 488 203" class="ln acc"/>
        <path d="M238 259 C 330 259, 380 203, 488 203" class="ln acc"/>
        <path d="M450 278 L 488 278" class="ln" marker-end="url(#ah)"/>
        <text x="300" y="60" class="s">hashed together</text>
        <text x="300" y="190" class="s">hashed one by one</text>
      </svg>
